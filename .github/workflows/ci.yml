name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # ── Core workspace (admin_authority, token_authority_core, sdk, examples) ───
  test:
    name: test (workspace — 44 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo check
        run: cargo check --workspace --exclude token-authority-guest

      - name: cargo test (44 tests expected)
        run: cargo test --workspace --exclude token-authority-guest

      - name: Run fixed_supply example
        run: cargo run --bin fixed_supply

      - name: Run variable_supply example
        run: cargo run --bin variable_supply

      - name: Verify 0 warnings
        run: |
          cargo check --workspace --exclude token-authority-guest 2>&1 | tee /tmp/check.log
          if grep -q "^warning" /tmp/check.log; then
            echo "Warnings found — failing CI"
            exit 1
          fi

  # ── Guest coverage ──────────────────────────────────────────────────────────
  # The guest is NOT cargo-checked against a stock bare-metal target: its
  # dependency stack (risc0-zkvm, sha2/crypto-common, spel-framework, lee_core)
  # needs `std`, provided only by risc0's own riscv32im-risc0-zkvm-elf target
  # (via the risc0 toolchain), not the stock riscv32im-unknown-none-elf. The
  # guest is instead covered by (a) the reproducible ProgramId build and (b) the
  # integration tests below, which run the prebuilt guest ELF through lee's
  # V03State — the same state machine the LEZ sequencer runs.
  integration-test:
    name: integration tests (lee V03State — 4 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-integration-

      - name: cargo test (integration_tests — 4 tests expected)
        run: cargo test -p integration_tests -- --nocapture
