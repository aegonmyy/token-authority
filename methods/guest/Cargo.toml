[package]
name    = "token-authority-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "token_authority"
path = "src/bin/token_authority.rs"

[dependencies]
spel-framework        = { path = "../../vendor/spel-framework/spel-framework" }
lee_core              = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "a58fbce2ff48c58b7bb5001b1a27e64b9596ee3a", features = ["host"] }
risc0-zkvm            = { version = "=3.0.5", default-features = false }
admin_authority       = { path = "../../admin_authority" }
token_authority_core  = { path = "../../token_authority_core" }
borsh                 = { version = "1", features = ["derive"] }
serde                 = { version = "1", features = ["derive"] }
ruint                 = "=1.17.0"
getrandom             = { version = "=0.2.17", features = ["custom"] }
