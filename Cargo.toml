[workspace]
members = [
    "admin_authority",
    "token_authority_core",
]
exclude = [
    "methods",
]
resolver = "2"

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "MIT OR Apache-2.0"

[workspace.dependencies]
borsh       = { version = "1", features = ["derive"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
admin_authority       = { path = "admin_authority" }
token_authority_core  = { path = "token_authority_core" }
