[workspace]
members = [
    "admin_authority",
    "token_authority_core",
    "token_authority_sdk",
    "examples",
    "methods",
    "integration_tests",
]
exclude = [
    "methods/guest",
]
resolver = "2"

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "MIT OR Apache-2.0"

[workspace.dependencies]
borsh       = { version = "1", features = ["derive"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
risc0-zkvm  = { version = "=3.0.5", features = ["std"] }
lee         = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "a58fbce2ff48c58b7bb5001b1a27e64b9596ee3a", features = ["prove", "test-utils"] }
lee_core    = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "a58fbce2ff48c58b7bb5001b1a27e64b9596ee3a", features = ["host"] }
admin_authority       = { path = "admin_authority" }
token_authority_core  = { path = "token_authority_core" }
token_authority_sdk   = { path = "token_authority_sdk" }
